<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人知识库</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-book-open"></i>
                <h1>知识库</h1>
            </div>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="搜索文章...">
            </div>
            <div class="user-actions">
                <button class="btn-icon" id="addDocBtn" title="写文章">
                    <i class="fas fa-pen-fancy"></i>
                </button>
                <button class="btn-icon" title="设置">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 主体内容 -->
    <div class="main-container">
        <!-- 左侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <h3><i class="fas fa-folder"></i> 分类</h3>
                <ul class="category-list">
                    <li class="category-item active" data-category="all">
                        <i class="fas fa-th-large"></i>
                        <span>全部文章</span>
                        <span class="count">0</span>
                    </li>
                    <li class="category-item" data-category="tech">
                        <i class="fas fa-code"></i>
                        <span>编程技术</span>
                        <span class="count">0</span>
                    </li>
                    <li class="category-item" data-category="project">
                        <i class="fas fa-project-diagram"></i>
                        <span>项目文档</span>
                        <span class="count">0</span>
                    </li>
                    <li class="category-item" data-category="study">
                        <i class="fas fa-graduation-cap"></i>
                        <span>学习笔记</span>
                        <span class="count">0</span>
                    </li>
                    <li class="category-item" data-category="idea">
                        <i class="fas fa-lightbulb"></i>
                        <span>灵感想法</span>
                        <span class="count">0</span>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="content">
            <!-- 文章列表 -->
            <div class="articles-container" id="articlesContainer">
                <!-- 文章由JS动态渲染 -->
            </div>

            <!-- 分页 -->
            <div class="pagination">
                <!-- 分页由JS动态渲染 -->
            </div>

            <!-- 文章详情视图 -->
            <div class="article-detail-view" id="articleDetailView" style="display: none;">
                <div class="detail-header">
                    <button class="btn-back" id="backToList">
                        <i class="fas fa-arrow-left"></i> 返回列表
                    </button>
                    <div class="detail-actions">
                        <button class="btn-action" id="editDetailArticle" title="编辑"><i class="fas fa-edit"></i></button>
                        <button class="btn-action" id="deleteDetailArticle" title="删除"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
                <article class="detail-content">
                    <div class="detail-meta">
                        <span class="category-badge" id="detailCategory"></span>
                        <span class="detail-date"><i class="fas fa-calendar-alt"></i> <span id="detailDate"></span></span>
                        <span class="detail-views"><i class="fas fa-eye"></i> <span id="detailViews"></span></span>
                    </div>
                    <h1 class="detail-title" id="detailTitle"></h1>
                    <div class="detail-tags" id="detailTags"></div>
                    <div class="detail-body" id="detailBody"></div>
                </article>
            </div>
        </main>
    </div>

    <!-- 新建/编辑文章模态框 -->
    <div class="modal" id="docModal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2 id="modalTitle">写文章</h2>
                <button class="btn-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="docForm">
                    <div class="form-group">
                        <label for="docTitle">文章标题</label>
                        <input type="text" id="docTitle" required placeholder="请输入文章标题">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="docCategory">分类</label>
                            <select id="docCategory">
                                <option value="tech">编程技术</option>
                                <option value="project">项目文档</option>
                                <option value="study">学习笔记</option>
                                <option value="idea">灵感想法</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="docTags">标签</label>
                            <input type="text" id="docTags" placeholder="Python, 教程">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="docContent">文章内容</label>
                        <textarea id="docContent" rows="20" placeholder="请输入文章内容..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelBtn">取消</button>
                <button class="btn-primary" id="saveBtn">发布文章</button>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
