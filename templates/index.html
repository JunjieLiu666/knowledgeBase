<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人知识库</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Markdown渲染库 -->
    <script src="/static/js/libs/marked.min.js"></script>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-book-open"></i>
                <h1>知识库</h1>
            </div>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="搜索文章...">
            </div>
            <div class="user-actions">
                <button class="btn-icon" id="addDocBtn" title="写文章">
                    <i class="fas fa-pen-fancy"></i>
                </button>
                <button class="btn-icon" id="settingsBtn" title="设置">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 主体内容 -->
    <div class="main-container">
        <!-- 左侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <h3><i class="fas fa-folder"></i> 分类</h3>
                <ul class="category-list">
                    <li class="category-item active" data-category="all">
                        <i class="fas fa-th-large"></i>
                        <span>全部文章</span>
                        <span class="count">0</span>
                    </li>
                    <li class="category-item" data-category="tech">
                        <i class="fas fa-code"></i>
                        <span>编程技术</span>
                        <span class="count">0</span>
                    </li>
                    <li class="category-item" data-category="project">
                        <i class="fas fa-project-diagram"></i>
                        <span>项目文档</span>
                        <span class="count">0</span>
                    </li>
                    <li class="category-item" data-category="study">
                        <i class="fas fa-graduation-cap"></i>
                        <span>学习笔记</span>
                        <span class="count">0</span>
                    </li>
                    <li class="category-item" data-category="idea">
                        <i class="fas fa-lightbulb"></i>
                        <span>灵感想法</span>
                        <span class="count">0</span>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="content">
            <!-- 文章列表 -->
            <div class="articles-container" id="articlesContainer">
                <!-- 文章由JS动态渲染 -->
            </div>

            <!-- 分页 -->
            <div class="pagination">
                <!-- 分页由JS动态渲染 -->
            </div>

            <!-- 文章详情视图 -->
            <div class="article-detail-view" id="articleDetailView" style="display: none;">
                <div class="detail-header">
                    <button class="btn-back" id="backToList">
                        <i class="fas fa-arrow-left"></i> 返回列表
                    </button>
                    <div class="detail-actions">
                        <button class="btn-action" id="editDetailArticle" title="编辑"><i class="fas fa-edit"></i></button>
                        <button class="btn-action" id="deleteDetailArticle" title="删除"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
                <div class="detail-container">
                    <article class="detail-content">
                        <div class="detail-meta">
                            <span class="category-badge" id="detailCategory"></span>
                            <span class="detail-date"><i class="fas fa-calendar-alt"></i> <span id="detailDate"></span></span>
                            <span class="detail-views"><i class="fas fa-eye"></i> <span id="detailViews"></span></span>
                        </div>
                        <h1 class="detail-title" id="detailTitle"></h1>
                        <div class="detail-tags" id="detailTags"></div>
                        <div class="detail-body" id="detailBody"></div>
                    </article>
                    <aside class="detail-outline" id="detailOutline">
                        <div class="outline-header">
                            <i class="fas fa-list-ul"></i> 文章大纲
                        </div>
                        <nav class="outline-content" id="outlineContent"></nav>
                    </aside>
                </div>
            </div>
        </main>
    </div>

    <!-- 系统设置模态框 -->
    <div class="modal" id="settingsModal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2><i class="fas fa-cog"></i> 系统设置</h2>
                <button class="modal-close" id="closeSettingsModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="settings-container">
                    <!-- 设置标签页 -->
                    <div class="settings-tabs">
                        <button class="settings-tab active" data-tab="category">
                            <i class="fas fa-folder"></i> 分类管理
                        </button>
                        <button class="settings-tab" data-tab="theme">
                            <i class="fas fa-palette"></i> 主题设置
                        </button>
                        <button class="settings-tab" data-tab="display">
                            <i class="fas fa-desktop"></i> 显示设置
                        </button>
                    </div>

                    <!-- 设置内容区 -->
                    <div class="settings-content">
                        <!-- 分类管理 -->
                        <div class="settings-panel active" id="categoryPanel">
                            <div class="category-manager">
                                <div class="existing-categories">
                                    <h3>现有分类</h3>
                                    <ul class="manage-category-list" id="manageCategoryList">
                                        <!-- 由JS动态渲染 -->
                                    </ul>
                                </div>
                                <div class="add-category-form">
                                    <h3>添加新分类</h3>
                                    <div class="form-group">
                                        <input type="text" id="newCategoryName" placeholder="分类名称">
                                    </div>
                                    <div class="form-group">
                                        <input type="text" id="newCategoryIcon" placeholder="图标类名（如：fa-code）">
                                    </div>
                                    <div class="form-group">
                                        <input type="text" id="newCategoryKey" placeholder="分类键名（英文，如：tech）">
                                    </div>
                                    <button class="btn-primary" id="addCategoryBtn">
                                        <i class="fas fa-plus"></i> 添加分类
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- 主题设置 -->
                        <div class="settings-panel" id="themePanel">
                            <div class="theme-settings">
                                <h3>主题颜色</h3>
                                <div class="theme-colors">
                                    <div class="theme-color-option" data-theme="default">
                                        <div class="color-preview" style="background: linear-gradient(135deg, #3498db, #2980b9);"></div>
                                        <span>默认蓝</span>
                                    </div>
                                    <div class="theme-color-option" data-theme="green">
                                        <div class="color-preview" style="background: linear-gradient(135deg, #27ae60, #229954);"></div>
                                        <span>清新绿</span>
                                    </div>
                                    <div class="theme-color-option" data-theme="purple">
                                        <div class="color-preview" style="background: linear-gradient(135deg, #9b59b6, #8e44ad);"></div>
                                        <span>优雅紫</span>
                                    </div>
                                    <div class="theme-color-option" data-theme="orange">
                                        <div class="color-preview" style="background: linear-gradient(135deg, #e67e22, #d35400);"></div>
                                        <span>活力橙</span>
                                    </div>
                                    <div class="theme-color-option" data-theme="red">
                                        <div class="color-preview" style="background: linear-gradient(135deg, #e74c3c, #c0392b);"></div>
                                        <span>热情红</span>
                                    </div>
                                    <div class="theme-color-option" data-theme="dark">
                                        <div class="color-preview" style="background: linear-gradient(135deg, #2c3e50, #1a252f);"></div>
                                        <span>暗黑风</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 显示设置 -->
                        <div class="settings-panel" id="displayPanel">
                            <div class="display-settings">
                                <h3>字体大小</h3>
                                <div class="font-size-control">
                                    <button class="font-size-btn" data-size="small">小</button>
                                    <button class="font-size-btn active" data-size="medium">中</button>
                                    <button class="font-size-btn" data-size="large">大</button>
                                </div>

                                <h3>文章列表显示</h3>
                                <div class="display-options">
                                    <label class="checkbox-label">
                                        <input type="checkbox" id="showArticleViews" checked>
                                        <span>显示阅读量</span>
                                    </label>
                                    <label class="checkbox-label">
                                        <input type="checkbox" id="showArticleDate" checked>
                                        <span>显示发布日期</span>
                                    </label>
                                    <label class="checkbox-label">
                                        <input type="checkbox" id="showArticleTags" checked>
                                        <span>显示标签</span>
                                    </label>
                                </div>

                                <h3>每页文章数</h3>
                                <div class="articles-per-page">
                                    <select id="articlesPerPageSelect">
                                        <option value="4">4篇</option>
                                        <option value="6" selected>6篇</option>
                                        <option value="8">8篇</option>
                                        <option value="12">12篇</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 新建/编辑文章模态框 -->
    <div class="modal" id="docModal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2 id="modalTitle">写文章</h2>
                <button class="btn-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="docForm">
                    <div class="form-group">
                        <label for="docTitle">文章标题</label>
                        <input type="text" id="docTitle" required placeholder="请输入文章标题">
                    </div>
                    <!-- 文件上传 -->
                    <div class="form-group">
                        <label>从文件导入</label>
                        <div class="file-upload-area">
                            <input type="file" id="fileInput" accept=".docx,.doc,.pdf,.ofd" style="display: none;">
                            <button type="button" class="btn-upload" id="uploadFileBtn">
                                <i class="fas fa-file-upload"></i> 选择文件
                            </button>
                            <span class="file-name" id="fileName">支持 Word、PDF、OFD 格式</span>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="docCategory">分类</label>
                            <select id="docCategory">
                                <option value="tech">编程技术</option>
                                <option value="project">项目文档</option>
                                <option value="study">学习笔记</option>
                                <option value="idea">灵感想法</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="docTags">标签</label>
                            <input type="text" id="docTags" placeholder="Python, 教程">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="docContent">文章内容（支持Markdown格式）</label>
                        <!-- 编辑器工具栏 -->
                        <div class="editor-toolbar">
                            <button type="button" class="toolbar-btn" data-action="bold" title="粗体"><i class="fas fa-bold"></i></button>
                            <button type="button" class="toolbar-btn" data-action="italic" title="斜体"><i class="fas fa-italic"></i></button>
                            <button type="button" class="toolbar-btn" data-action="heading" title="标题"><i class="fas fa-heading"></i></button>
                            <span class="toolbar-divider"></span>
                            <button type="button" class="toolbar-btn" data-action="link" title="链接"><i class="fas fa-link"></i></button>
                            <button type="button" class="toolbar-btn" data-action="image" title="图片"><i class="fas fa-image"></i></button>
                            <span class="toolbar-divider"></span>
                            <button type="button" class="toolbar-btn" data-action="list" title="列表"><i class="fas fa-list-ul"></i></button>
                            <button type="button" class="toolbar-btn" data-action="quote" title="引用"><i class="fas fa-quote-left"></i></button>
                            <button type="button" class="toolbar-btn" data-action="code" title="代码"><i class="fas fa-code"></i></button>
                            <span class="toolbar-divider"></span>
                            <button type="button" class="toolbar-btn" data-action="hr" title="分割线"><i class="fas fa-minus"></i></button>
                        </div>
                        <textarea id="docContent" rows="20" placeholder="请输入文章内容...&#10;&#10;支持Markdown格式：&#10;**粗体** *斜体* # 标题&#10;- 列表项&#10;> 引用&#10;`代码`"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelBtn">取消</button>
                <button class="btn-primary" id="saveBtn">发布文章</button>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
